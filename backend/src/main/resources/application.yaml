spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:KalaEcommerceJwtSecretKeyForDevelopmentOnly123456789}
  expiration: 86400000

storage:
  local:
    root: uploads

server:
  port: 8080
